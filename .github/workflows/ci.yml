name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
      - name: go vet
        run: go vet ./...
      - name: tests
        run: go test ./...
      - name: race tests
        run: go test -race ./...
      - name: install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
      - name: build caddy with module
        run: make xcaddy-build
      - name: verify module registration
        run: make verify-module
