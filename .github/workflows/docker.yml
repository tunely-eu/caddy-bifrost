name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      CADDY_BIFROST_WITH: ${{ startsWith(github.ref, 'refs/tags/') && format('github.com/tunely-eu/caddy-bifrost@{0}', github.ref_name) || 'github.com/tunely-eu/caddy-bifrost=.' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Caddy version
        id: caddy
        run: |
          version="$(make caddy-version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/caddy-bifrost
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CADDY_VERSION=${{ steps.caddy.outputs.version }}
            CADDY_BIFROST_WITH=${{ env.CADDY_BIFROST_WITH }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
